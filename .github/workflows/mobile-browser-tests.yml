name: Mobile browser tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-e2e:
    # Playwright 1.56.1 cannot install browsers on the current ubuntu-latest (26.04) runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/validate_ohio_data.py
      - run: python3 -m unittest discover -s tests -p "test_ohio_data.py"
      - run: python3 scripts/validate_offers.py
      - run: python3 -m unittest discover -s tests -p "test_offers.py"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-browser-failures
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
